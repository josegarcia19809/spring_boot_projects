spring.application.name=asistente-medico


# =========================
# Gemini
# =========================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.4
spring.ai.google.genai.chat.top-p=0.85
spring.ai.google.genai.chat.max-output-tokens=2048


# =========================
# Ollama
# =========================

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b
spring.ai.ollama.chat.temperature=0.4
spring.ai.ollama.chat.top-p=0.85
spring.ai.ollama.chat.num-predict=2048

spring.datasource.url=jdbc:mysql://localhost:3306/asistente_medico
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# =========================
# Persistencia de la IA en la base de datos
# =========================
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# =========================
# Conexión con Chroma
# =========================
# ChromaDB
spring.ai.vectorstore.chroma.url=http://localhost:8000
spring.ai.vectorstore.chroma.collection-name=asistente_medico_ollama
spring.ai.vectorstore.chroma.initialize-schema=true

# Embeddings con Ollama
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text

# Desactivar embeddings de Google GenAI
spring.ai.model.embedding.text=none